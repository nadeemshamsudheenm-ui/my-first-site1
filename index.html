<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIYOKA DIGITAL HUB</title>
    <script src ="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFD96] text-slate-800 antialiased font-sans">
    <nav class="flex justify-between items-center bg-white px-8 py-5 border-b border-slate-200">
        <a href="#" class="text-xl font-bold text-red-500 tracking-wide">KIYOKA DIGITAL</a>
        <div class="space-x-6 font-medium text-slate-500">
            <a href="#" class="hover:text-slate-900 transition-colors">Home</a>
            <a href="#" class="hover:text-slate-900 transition-colors">Services</a>
            <a href="generator.html" class="hover:text-slate-900 transition-colors">Script Engine</a>
            <button class="bg-red-500 text-white px-4 py-2 rounded-md font-semibold hover:bg-red-600 transitions-colors">
                GET STARTED
            </button>   
        </div>
    </nav>
    <section class="max-w-6xl mx-auto px-6 py-16 flex flex-col md:flex-row items-center gap-12">
    
    <div class="flex-1 text-center md:text-left">
        <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 tracking-tight leading-tight">
            We Build High-Converting <span class="text-red-500">Digital Engines</span>
        </h1>
        <p class="mt-6 text-lg md:text-xl text-slate-600 leading-relaxed max-w-2xl">
         Local SEO Optimization, Web Development, and Digital Marketing Solutions.
        </p>
    </div>

    <div class="flex-1 flex justify-center w-full">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 max-w-md w-full">
            <h3 class="text-xl font-bold text-slate-900 mb-2">Deploy Your Brand</h3>
            <p class="text-slate-500 text-sm mb-6">Enter your email to sync your first digital optimization strategy with us.</p>
            
            <div class="space-y-4">
                <input id="userEmail" type="email" placeholder="Enter your email" class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:outline-none focus:border-red-500 bg-slate-50">
                <button id="strategyBtn" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg hover:bg-slate-800 transition-colors shadow-md">
                    Initialize Strategy
                </button>
            </div>
        </div>
    </div>

</section>
<script>
        const emailInput = document.getElementById('userEmail');
        const actionButton = document.getElementById('strategyBtn');

        actionButton.addEventListener('click', async () => {
            const emailValue = emailInput.value.trim();

            // 1. Basic validation check
            if (emailValue === "") {
                alert("Please enter a valid email address to initialize the system.");
                return;
            }

            // 2. Change button visual state to show processing
            actionButton.innerText = "Syncing System...";
            actionButton.disabled = true;

            try {
                // 3. Fire background network request to Formspree API
                // REPLACE THE URL BELOW WITH YOUR ACTUAL FORMSPREE LINK
                const response = await fetch("https://formspree.io/f/mnjrvnap", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: emailValue })
                });

                // 4. Handle response logic
                if (response.ok) {
                    alert(`System Signal Sent! Strategy initialized for: ${emailValue}. Check your inbox.`);
                    emailInput.value = ""; // Reset input field
                } else {
                    alert("System transmission failed. Please try again.");
                }
            } catch (error) {
                alert("Network timeout. Check your connectivity connection.");
            } finally {
                // 5. Restore button state
                actionButton.innerText = "Initialize Strategy";
                actionButton.disabled = false;
            }
        });
    </script>
</body>
</html>
