<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadeem's Hub</title>
    <style>
        /* Global Settings */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* 🗺️ NAVIGATION BAR (Flexbox Layout) */
        .navbar {
            display: flex;
            justify-content: space-between; /* Pushes brand to left, links to right */
            align-items: center;            /* Centers items vertically */
            padding: 20px 10px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .nav-brand {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
            text-decoration: none;
        }
        .nav-links a {
            text-decoration: none;
            color: #64748b;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #1e293b;
        }

        /* 🚀 HERO SECTION CONTAINER */
        .hero-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;                  /* Flexbox alignment */
            flex-direction: row;            /* Side-by-side layout */
            align-items: center;
            gap: 40px;                      /* Spacing between columns */
        }

        /* Hero Left Column (Text Content) */
        .hero-left {
            flex: 1;                        /* Takes up 50% width */
        }
        .hero-left h1 {
            font-size: 42px;
            line-height: 1.2;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .hero-left p {
            font-size: 18px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Hero Right Column (Your Custom Card) */
        .hero-right {
            flex: 1;                        /* Takes up 50% width */
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            border: 1px solid #e2e8f0;
        }

        /* Form Elements inside Card */
        form { text-align: left; }
        label { font-size: 12px; font-weight: bold; color: #64748b; display: block; margin-bottom: 5px; }
        input, textarea {
            width: 100%; padding: 10px; margin-bottom: 15px;
            border: 1px solid #cbd5e1; border-radius: 6px;
            box-sizing: border-box; font-family: inherit;
        }
        .submit-btn {
            width: 100%; background-color: #ff4757; color: white;
            border: none; padding: 12px; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }

        /* 📱 RESPONSIVE DESIGN (Mobile Rule) */
        @media (max-width: 768px) {
            .hero-container {
                flex-direction: column;     /* Stacks layout vertically on small screens */
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-brand">NS.Dev</a>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main class="hero-container">
        
        <section class="hero-left">
            <h1>Building Next-Gen Digital Experiences</h1>
            <p>Welcome to my development environment. I construct functional web applications, optimize automated pipelines, and configure live cloud systems from scratch.</p>
        </section>

        <section class="hero-right">
            <div class="card">
                <form action="https://formspree.io/f/mzdwdlaa" method="POST">
                    <label for="email">Launch a Project Request</label>
                    <input type="email" name="email" id="email" placeholder="yourname@domain.com" required>
                    
                    <label for="message">Project Description</label>
                    <textarea name="message" id="message" rows="4" placeholder="What system are we engineering?" required></textarea>
                    
                    <button type="submit" class="submit-btn">Send System Signal</button>
                </form>
            </div>
        </section>

    </main>

</body>
</html>
