<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyoka Script Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-950 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-red-500 font-black tracking-wider text-lg">KIYOKA ENGINE</span>
            <span class="bg-slate-800 text-slate-400 text-xs px-2 py-1 rounded font-mono">v1.0 // Content Automation</span>
        </div>
        <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">← Back to Public Site</a>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="bg-slate-950 p-6 rounded-xl border border-slate-800 space-y-6">
            <h2 class="text-xl font-bold text-white border-b border-slate-800 pb-3">Script Parameters</h2>
            
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Video Topic / Core Hook</label>
                <input id="topicInput" type="text" placeholder="e.g., 3 Hidden Tech Secrets Making Teenagers Rich" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Narrative Style</label>
                <select id="styleSelect" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-500">
                    <option value="fast">Fast-Paced / Retention Focused (Shorts/Reels)</option>
                    <option value="docu">Documentary Style / Deep Dive (Long-form)</option>
                    <option value="story">Story-Driven / High Suspense</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">Raw Value Points (One per line)</label>
                <textarea id="pointsInput" rows="5" placeholder="Point 1: AI tools are free but hidden&#10;Point 2: Arbitrage models scale fast&#10;Point 3: Automate the delivery loop" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 font-mono text-sm"></textarea>
            </div>

            <button id="compileBtn" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-500 transition-colors shadow-lg shadow-red-900/20">
                Compile Production Blueprint
            </button>
        </section>

        <section class="flex flex-col space-y-4">
            <div class="flex justify-between items-center">
    <h2 class="text-xl font-bold text-white">Production Script Output</h2>
    <button id="copyBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono text-xs px-3 py-1.5 rounded-md border border-slate-700 transition-colors hidden">
        📋 Copy Raw Text
    </button>
</div>
            
            <div id="outputCanvas" class="bg-slate-950 border border-slate-800 rounded-xl p-6 flex-1 min-h-[400px] font-mono text-xs overflow-y-auto space-y-4 text-slate-400">
                <div class="text-center text-slate-600 py-20">[ Waiting for script compilation parameters... ]</div>
            </div>
        </section>

    </main>
<script>
        // 1. Get references to our control panel inputs and output canvas
        const topicInput = document.getElementById('topicInput');
        const styleSelect = document.getElementById('styleSelect');
        const pointsInput = document.getElementById('pointsInput');
        const compileBtn = document.getElementById('compileBtn');
        const outputCanvas = document.getElementById('outputCanvas');

        // 2. Set up click action listener
        compileBtn.addEventListener('click', () => {
            const topic = topicInput.value.trim();
            const style = styleSelect.value;
            const pointsText = pointsInput.value.trim();

            // Simple validation guard rail
            if (topic === "" || pointsText === "") {
                alert("Please fill in the Topic and supply some Raw Value Points first.");
                return;
            }

            // Split raw input text by lines to handle bullet points individually
            const lines = pointsText.split('\n').filter(line => line.trim() !== "");

            // 3. Define Hook templates based on chosen narrative speed style
            let hookLine = "";
            let pacingNote = "";
            if (style === "fast") {
                hookLine = `[0-3s HOOK]: "Stop scrolling. If you don't understand how ${topic} works right now, you're falling behind."`;
                pacingNote = "FAST PACED // 140 WPM // BOOMERANG CUTS";
            } else if (style === "docu") {
                hookLine = `[0-15s HOOK]: "This is the reality of ${topic}. An underlying asset shift that most people won't recognize until it's too late."`;
                pacingNote = "DOCUMENTARY // CINEMATIC pacing // DEEP LOWER THIRDS";
            } else {
                hookLine = `[0-10s HOOK]: "They wanted to keep ${topic} hidden. Here is exactly how the system unfolded."`;
                pacingNote = "SUSPENSEFUL SLOW BURN // HIGH DRAMA AUDIO";
            }

            // 4. Generate the structured blueprint layout blocks
            let compiledHTML = `
                <div class="border border-red-900/40 bg-red-950/20 p-4 rounded-lg mb-4 text-slate-300">
                    <span class="text-red-400 font-bold block mb-1">🎬 METADATA & CONTROL PACK</span>
                    <p><strong class="text-slate-400">Pacing Strategy:</strong> ${pacingNote}</p>
                </div>

                <div class="border border-slate-800 bg-slate-900/60 p-4 rounded-lg mb-4 text-emerald-400 font-bold">
                    ${hookLine}
                </div>
                
                <h3 class="text-white font-bold text-sm mb-2 uppercase tracking-wider text-slate-400">📝 Body Core Segments</h3>
                <div class="space-y-3">
            `;

            // Loop through each value bullet point dynamically and format into a production grid layout line
            lines.forEach((point, index) => {
                compiledHTML += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 border border-slate-800 bg-slate-900/40 p-3 rounded-lg">
                        <div class="text-slate-500 font-bold">[ SEGMENT 0${index + 1} ]</div>
                        <div class="text-slate-300 md:col-span-2">
                            <span class="text-red-400/80 block text-[10px] uppercase font-bold tracking-widest">Audio / Voiceover Script</span>
                            "${point.trim()}"
                        </div>
                    </div>
                `;
            });

            compiledHTML += `
                </div>
                <div class="mt-4 border border-blue-900/40 bg-blue-950/20 p-4 rounded-lg text-blue-400 font-bold">
                    [🚀 CTA / OUTRO]: "Drop a follow to lock into the Kiyoka pipeline. Link in bio to optimize your systems."
                </div>
            `;

            // 5. Inject the newly compiled structure string directly onto our target preview section
            outputCanvas.innerHTML = compiledHTML;
        });
    </script>
</body>
</html>
